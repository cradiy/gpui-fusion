[package]
name = "gpui_richtext"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "MIT"
authors = ["cradiy <cradiy.rs@gmail.com>"]
readme = "README.md"

[features]
default = []
markdown = ["dep:pulldown-cmark", "dep:percent-encoding"]
syntax-highlighting = ["dep:syntect"]
syntax-extra = ["syntax-highlighting", "dep:two-face", "syntect/yaml-load"]
mermaid = ["dep:mermaid-svg"]
math = ["dep:latex-rust"]

[dependencies]
gpui.workspace = true
gpui_icons = { workspace = true, features = ["lucide-core"] }
anyhow.workspace = true
mermaid-svg = { version = "0.7", optional = true }
latex-rust = { version = "3.0.1", default-features = false, features = ["std"], optional = true }
pulldown-cmark = { version = "0.13", default-features = false, optional = true }
percent-encoding = { version = "2.3", optional = true }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"], optional = true }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"], optional = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }

[lints]
workspace = true

[[example]]
name = "markdown"
required-features = ["markdown"]

[[example]]
name = "code_highlighting"
required-features = ["syntax-highlighting"]

[[example]]
name = "mermaid"
required-features = ["mermaid"]

[[example]]
name = "math"
required-features = ["math"]
