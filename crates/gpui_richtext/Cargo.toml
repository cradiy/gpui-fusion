[package]
name = "gpui_richtext"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "MIT"
authors = ["cradiy <cradiy.rs@gmail.com>"]
readme = "README.md"

[features]
default = []
markdown = ["dep:pulldown-cmark"]
syntax-highlighting = ["dep:syntect"]

[dependencies]
gpui.workspace = true
gpui_icons = { workspace = true, features = ["lucide-core"] }
anyhow.workspace = true
pulldown-cmark = { version = "0.13", default-features = false, optional = true }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"], optional = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }

[lints]
workspace = true

[[example]]
name = "markdown"
required-features = ["markdown"]
