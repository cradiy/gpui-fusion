version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "MIT"
authors = ["cradiy <cradiy.rs@gmail.com>"]

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
