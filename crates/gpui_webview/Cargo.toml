[package]
name = "gpui_webview"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "MIT"
authors = ["cradiy <cradiy.rs@gmail.com>"]
readme = "README.md"

[features]
default = []
servo = [
  "dep:servo",
  "dep:dpi",
  "dep:euclid",
  "dep:raw-window-handle",
  "dep:rustls",
  "dep:wayland-client",
  "dep:wayland-backend",
  "dep:wayland-protocols",
]

[dependencies]
gpui.workspace = true
anyhow.workspace = true
async-channel.workspace = true
futures.workspace = true
url.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
servo = { git = "https://github.com/cradiy/servo", rev = "35441cb8cd306a0da5e01626685051976906ccde", default-features = false, features = [
  "baked-in-resources",
  "js_jit",
], optional = true }
dpi = { version = "0.1", optional = true }
euclid = { version = "0.22", optional = true }
raw-window-handle = { version = "0.6", optional = true }
rustls = { version = "0.23", default-features = false, features = [
  "aws_lc_rs",
], optional = true }
wayland-client = { version = "0.31", features = ["system"], optional = true }
wayland-backend = { version = "0.3", features = [
  "client_system",
], optional = true }
wayland-protocols = { version = "0.32", features = ["client"], optional = true }

[dev-dependencies]
gpui_platform = { workspace = true, default-features = true }

[[example]]
name = "browser"
required-features = ["servo"]

[lints]
workspace = true
