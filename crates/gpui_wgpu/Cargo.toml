[package]
name = "gpui_wgpu"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_wgpu.rs"

[features]
default = []
font-kit = ["dep:font-kit"]

[dependencies]
gpui.workspace = true
gpui_render.workspace = true
anyhow.workspace = true
bitflags.workspace = true
bytemuck = "1"
collections.workspace = true
cosmic-text = "0.19.0"
etagere = "0.2"
itertools.workspace = true
log.workspace = true
parking_lot.workspace = true
profiling.workspace = true
raw-window-handle = "0.6"
smallvec.workspace = true
swash = "0.2.6"
unicode-segmentation.workspace = true
gpui_util.workspace = true
half = "2.7.1"
wgpu = { workspace = true, features = ["naga-ir"] }

# Optional: only needed on platforms with multiple font sources (e.g. Linux)
font-kit = { git = "https://github.com/cradiy/font-kit", rev = "ef41ce125c6d92ce7af6c153df42dc3de81c8437", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
pollster.workspace = true
wgpu-hal = { version = "30.0.1", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
ash = "0.38"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-video.workspace = true
objc2-core-foundation.workspace = true
core-foundation.workspace = true
foreign-types = "0.5"
objc2.workspace = true
objc2-metal = "0.3.2"

[target.'cfg(target_family = "wasm")'.dependencies]
# Match wgpu's Naga version and enable runtime WGSL validation on WebGPU.
naga.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "VideoFrame"] }
js-sys = "0.3"

[dev-dependencies]
criterion.workspace = true
naga.workspace = true

[[bench]]
name = "layout_line"
harness = false
