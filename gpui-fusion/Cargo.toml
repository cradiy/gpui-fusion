[package]
name = "gpui-fusion"
version = "0.1.0"
publish.workspace = true
edition.workspace = true
license = "MIT"
authors = ["cradiy <cradiy.rs@gmail.com>"]

[lints]
workspace = true

[features]
default = ["theme-watch"]
theme-watch = ["dep:notify", "dep:async-channel"]

[dependencies]
gpui_icons = { workspace = true, features = ["lucide-core", "lucide-common"] }
unicode-segmentation.workspace = true
gpui.workspace = true
gpui_effects.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
dirs = "6"
toml = "0.9.8"
notify = { version = "8.2", optional = true }
async-channel = { workspace = true, optional = true }

[dev-dependencies]
gpui_wgpu.workspace = true
tempfile.workspace = true
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["wayland", "font-kit"] }
