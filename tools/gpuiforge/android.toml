activity = "dev.gpuiforge.app.MainActivity"
abis = ["arm64-v8a", "x86_64"]
artifact = "app/build/outputs/apk/{{profile}}/app-{{profile}}{{apk_suffix}}.apk"

[variables]
min_sdk = "26"
target_sdk = "36"
version_code = "1"
version_name = "0.1.0"

[[build]]
program = "bash"
args = ["gradlew", "--no-daemon", "-PgpuiAbis={{abis}}", "-PgpuiForgeExecutable={{tool_path}}", ":app:assemble{{variant}}"]
cwd = "{{project_dir}}"

[[run]]
program = "{{adb}}"
args = ["-s", "{{device}}", "install", "-r", "{{artifact}}"]

[[run]]
program = "{{adb}}"
args = ["-s", "{{device}}", "shell", "am", "start", "-W", "-n", "{{application_id}}/{{activity}}"]
error-pattern = "Error:"
