[package]
name = "uic"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["cradiy <cradiy.rs@gmail.com>"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
strum = { workspace = true, features = ["derive", "strum_macros"] }
unicode-segmentation = { workspace = true }
anyhow = { workspace = true }
scheduler = { workspace = true }
chrono = { workspace = true }
gpui = { workspace = true }
gpui_effects = { workspace = true }
gpui_icons = { workspace = true, features = ["lucide-core"] }
uic_macros = { workspace = true }

[dev-dependencies]
gpui_icons = { workspace = true, features = ["lucide-common"] }
gpui = { workspace = true, features = ["test-support"] }
gpui_wgpu = { workspace = true }
gpui_platform = { workspace = true, features = ["wayland", "font-kit"] }
